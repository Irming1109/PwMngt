name: Create GitHub Release

# Manual fallback only (Actions -> "Create GitHub Release" -> Run workflow,
# enter the tag). release.ps1 normally creates the release itself with gh,
# so it is published under the name of whoever deploys -- a release made
# here shows "github-actions" as its author instead (Claus, 2026-10-26).
# No longer triggered by tag pushes, or it would race release.ps1.
#
# Reads the release title/notes straight from the tag's own annotated
# message (set by release.ps1 via `git tag -a -F RELEASE_NOTES.md`), and
# publishes it as a full (non-prerelease) GitHub Release, marked as
# "Latest".
#
# IMPORTANT: every release up through v0.2.23 was published with
# --prerelease, which means HACS never saw a "latest" release for this
# repo. On a fresh install (no existing entry to redownload), this makes
# HACS's default version resolution unreliable -- it can offer/install an
# old version instead of the newest one (confirmed: this is what happened
# when Claus did a first-time install and got an outdated Options wizard).
# Dropping --prerelease here fixes this going forward for new installs.
#
# Uses the repo's automatic GITHUB_TOKEN; no secrets to configure. Requires
# "Workflow permissions" under Settings -> Actions -> General to be set to
# "Read and write permissions" (one-time repo setting, not per-release).
#
# Skips instead of failing if the release already exists.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.4.04"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (tag only, with its annotation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract tag message and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ inputs.tag }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists -- nothing to do."
            exit 0
          fi

          # actions/checkout@v4 fetches the tag correctly, then re-fetches by
          # commit sha and overwrites refs/tags/$TAG to point straight at the
          # commit -- silently discarding the annotation. Re-fetch the tag by
          # NAME from origin to restore the real annotated tag object before
          # reading its message, otherwise %(contents) falls back to the
          # underlying commit message instead of our release notes.
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' > /tmp/notes.md

          if [ -s /tmp/notes.md ]; then
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          else
            # Fallback: lightweight tag with no message -- let GitHub
            # auto-generate notes instead of publishing an empty release.
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
